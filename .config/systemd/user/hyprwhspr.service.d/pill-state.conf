[Service]
# Starter hyprwhspr gennem ~/.Scripts/hyprwhspr-service, som skriver
# visualizer_state -- den fil pillens Voice-service laeser. Uden det her
# koerer hyprwhspr sin egen Mic-OSD i stedet.
#
# Hed foer waybar-state.conf. Filen skrives stadig; det er kun laeseren der
# er skiftet fra waybar til pillen.
ExecStart=
ExecStart=/home/ringdal/.local/share/hyprwhspr/venv/bin/python /home/ringdal/.Scripts/hyprwhspr-service
