# Hyprland — ported from bspwmrc + core sxhkdrc binds
# Terminal: alacritty

source = ~/.config/hypr/colors.conf

################
### MONITORS ###
################

# Auto-detect; override with e.g. monitor = eDP-1,preferred,auto,1
monitor = ,preferred,auto,1

###################
### AUTOSTART   ###
###################

exec-once = waybar
exec-once = dunst

################
### PROGRAMS ###
################

$terminal = alacritty
$fileManager = alacritty -e lf
$browser = qutebrowser
$browserAlt = firefox
$mod = SUPER

#################
### LOOK / FEEL ###
#################

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 1
    col.active_border = $active_border
    col.inactive_border = $inactive_border
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = windows, 1, 3, easeOut, popin 80%
    animation = fade, 1, 3, easeOut
    animation = workspaces, 1, 3, easeOut, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 0
    # bspwm split_ratio ~0.55 has no exact match; default split is fine
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    focus_on_activate = true
}

#############
### INPUT ###
#############

input {
    kb_layout = dk
    kb_variant = nodeadkeys
    kb_options = caps:swapescape,shift:both_capslock

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

gestures {
    workspace_swipe = false
}

###################
### KEYBINDINGS ###
###################

# Terminal
bind = $mod, Return, exec, $terminal
bind = $mod SHIFT, Return, exec, $terminal --class float

# Apps
bind = $mod, O, exec, $browser
bind = $mod, W, exec, $browserAlt
bind = $mod, E, exec, $fileManager

# Kill / force kill
bind = $mod, Q, killactive,
bind = $mod SHIFT, Q, forcekillactive,

# Reload / exit
bind = $mod SHIFT, R, exec, hyprctl reload
bind = $mod SHIFT, Escape, exit,

# Focus
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# Swap
bind = $mod SHIFT, H, swapwindow, l
bind = $mod SHIFT, J, swapwindow, d
bind = $mod SHIFT, K, swapwindow, u
bind = $mod SHIFT, L, swapwindow, r

# Workspaces 1–10
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Cycle workspaces
bind = $mod, Tab, workspace, e+1
bind = $mod SHIFT, Tab, workspace, e-1

# Last window
bind = $mod, grave, focuscurrentorlast,

# Window states (bspwm: t / shift+space / f)
bind = $mod, T, togglefloating,
bind = $mod, F, fullscreen, 0
bind = $mod CTRL, S, pin,

# Resize (Super+Alt+hjkl)
binde = $mod ALT, H, resizeactive, -20 0
binde = $mod ALT, J, resizeactive, 0 20
binde = $mod ALT, K, resizeactive, 0 -20
binde = $mod ALT, L, resizeactive, 20 0

# Move floating (Alt+Shift+hjkl)
binde = ALT SHIFT, H, moveactive, -20 0
binde = ALT SHIFT, J, moveactive, 0 20
binde = ALT SHIFT, K, moveactive, 0 -20
binde = ALT SHIFT, L, moveactive, 20 0

# Mouse: move / resize with Super
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Volume
bindel = , XF86AudioRaiseVolume, exec, pamixer -i 5
bindel = , XF86AudioLowerVolume, exec, pamixer -d 5
bindl = , XF86AudioMute, exec, pamixer -t
bindl = $mod, XF86AudioRaiseVolume, exec, pamixer --allow-boost -i 5
bindl = $mod, XF86AudioLowerVolume, exec, pamixer --allow-boost -d 5

# Brightness
bindel = , XF86MonBrightnessUp, exec, sudo light -A 5
bindel = , XF86MonBrightnessDown, exec, sudo light -U 5

####################
### WINDOW RULES ###
####################

# Floating helpers (bspwm class names)
windowrulev2 = float, class:^(float)$
windowrulev2 = float, class:^(scratchterm)$
windowrulev2 = float, class:^(scratchmath)$
windowrulev2 = size 1000 400, class:^(scratchmath)$
windowrulev2 = float, class:^(bye)$
windowrulev2 = float, class:^(cal)$
windowrulev2 = float, class:^(net)$
windowrulev2 = float, class:^(gass)$
windowrulev2 = float, class:^(files)$
windowrulev2 = float, class:^(follow)$
windowrulev2 = fullscreen, class:^(fullscreen)$

# Sticky / pin equivalents
windowrulev2 = pin, class:^(scratchterm)$
windowrulev2 = pin, class:^(scratchmath)$
windowrulev2 = pin, class:^(files)$
windowrulev2 = pin, class:^(follow)$
windowrulev2 = pin, class:^(gass)$

# Zathura tiled (bspwm rule)
windowrulev2 = tile, class:^(Zathura)$

# Android Studio startup
windowrulev2 = tile, class:^(jetbrains-studio)$
