# ThinkPad T14s Gen 2a (AMD) — thinkfan 2.x YAML
# Name-based hwmon paths (stable across boot order).
# Adjust if your sensors differ (sensors / thinkfan -n).

sensors:
  - hwmon: /sys/class/hwmon
    name: k10temp
    indices: [1]
  - hwmon: /sys/class/hwmon
    name: amdgpu
    indices: [1]
  - hwmon: /sys/class/hwmon
    name: thinkpad
    indices: [1]
  - hwmon: /sys/class/hwmon
    name: nvme
    indices: [1]
    optional: true

fans:
  - tpacpi: /proc/acpi/ibm/fan

levels:
  - [0, 0, 45]
  - [1, 40, 55]
  - [2, 50, 65]
  - [3, 60, 72]
  - [4, 68, 78]
  - [5, 74, 84]
  - [6, 80, 90]
  - [7, 85, 95]
  - ["level disengaged", 90, 255]
