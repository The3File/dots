# ThinkPad T14s Gen 2a (AMD) — thinkfan 2.x YAML
# Name-based hwmon paths (stable across boot order).
# Quiet-first: stay off through idle (~40–50°C). High end unchanged.

sensors:
  - hwmon: /sys/class/hwmon
    name: k10temp
    indices: [1]
  - hwmon: /sys/class/hwmon
    name: amdgpu
    indices: [1]
  - hwmon: /sys/class/hwmon
    name: thinkpad
    indices: [1]
  - hwmon: /sys/class/hwmon
    name: nvme
    indices: [1]
    optional: true

fans:
  - tpacpi: /proc/acpi/ibm/fan

# [level, lower, upper] — max of all sensors. Hysteresis in the overlap.
levels:
  - [0, 0, 55]
  - [1, 48, 62]
  - [2, 56, 68]
  - [3, 62, 75]
  - [4, 70, 80]
  - [5, 76, 85]
  - [6, 81, 90]
  - [7, 86, 95]
  - ["level disengaged", 91, 255]
